<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LebRecycle - User</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1><i class="fas fa-recycle"></i> LebRecycle</h1>
      <nav>
        <a href="/">Home</a>

        <a href="#" id="logoutLink">Logout</a>

      </nav>
    </div>
  </header>

  <main class="container" style="padding: 120px 0 24px 0; min-height: calc(100vh - 80px);">
    <section id="authView" class="card" style="max-width: 560px; margin: 0 auto;">
      <h2 style="margin-bottom: 14px;">Your Recycling Account</h2>

        <div style="display:grid; grid-template-columns: 1fr; gap: 12px;">

        <div class="card" style="padding: 14px;">
          <h3 style="margin-bottom: 10px;">Login</h3>
          <div class="form-row" style="margin-bottom: 10px;">
            <label for="loginUsername">Username</label>
            <input id="loginUsername" type="text" autocomplete="username" required />
          </div>
          <div class="form-row" style="margin-bottom: 10px;">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </div>
          <button id="loginBtn" class="btn btn-primary" style="width:100%;">Login</button>
          <button id="showRegisterBtn" class="btn" style="width:100%; margin-top: 10px; display:block;">Register</button>
          <p id="authMsg" class="muted" style="margin-top: 10px;"></p>

        </div>

        <div class="card" style="padding: 14px; display:none;" id="registerCard">
          <h3 style="margin-bottom: 10px;">Register</h3>

          <div class="form-row" style="margin-bottom: 10px;">
            <label for="regUsername">Username</label>
            <input id="regUsername" type="text" autocomplete="username" required />
          </div>
          <div class="form-row" style="margin-bottom: 10px;">
            <label for="regPassword">Password</label>
            <input id="regPassword" type="password" autocomplete="new-password" required />
          </div>
          <button id="registerBtn" class="btn btn" style="width:100%;">Create Account</button>
        </div>
      </div>


    </section>

    <section id="userView" style="display:none; max-width: 900px; margin: 0 auto;">
      <div class="card" style="margin-bottom: 16px; padding: 16px;">
        <div style="display:flex; gap: 12px; align-items:flex-start; flex-wrap: wrap;">
          <div style="flex:1; min-width: 260px;">
            <h2 style="margin: 0 0 6px 0;">Welcome, <span id="userNameText"></span> 👋</h2>
            <p class="muted" style="margin: 0;">Total points: <strong id="pointsText">0</strong></p>
          </div>
          <div style="min-width: 240px;">
            <div class="stat-card" style="padding: 14px; border-radius: 12px;">
              <div class="muted">Last submission</div>
              <div style="font-size: 20px; font-weight: 800;" id="lastPointsText">-</div>
              <div class="muted" id="lastDateText"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 16px; padding: 16px;">
        <h3 style="margin-bottom: 10px;">Recycle today</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr 160px; gap: 12px; align-items:end;">
          <div class="form-row">
            <label for="materialSelect">Material</label>
            <select id="materialSelect" style="width:100%; padding:12px; border-radius:12px; border:1px solid rgba(0,0,0,0.08);">
              <option value="paper">Paper</option>
              <option value="glass">Glass</option>
              <option value="metal">Metal</option>
              <option value="plastic">Plastic</option>
            </select>
          </div>

          <div class="form-row">
            <label for="quantityInput">Quantity</label>
            <input id="quantityInput" type="number" step="1" min="1" placeholder="e.g. 10" />
          </div>

          <button id="recycleBtn" class="btn btn-primary" type="button">Log Recycling</button>
        </div>

        <div class="form-row" style="margin-top: 12px;">
          <label for="notes">Notes (optional)</label>
          <input id="notes" type="text" placeholder="e.g. plastic bottles" />
        </div>

        <p id="recycleMsg" class="muted" style="margin-top: 10px;"></p>
      </div>

      <div class="card" style="padding: 16px;">
        <h3 style="margin-bottom: 12px;">Recent recycling entries</h3>
        <div style="overflow:auto; border:1px solid #eee; border-radius: 10px;">
          <table style="width:100%; border-collapse: collapse;">
            <thead>
              <tr style="background:#f8f9fa;">
                <th style="text-align:left; padding:10px; border-bottom:1px solid #eee;">Date</th>
                <th style="text-align:left; padding:10px; border-bottom:1px solid #eee;">Items</th>

                <th style="text-align:left; padding:10px; border-bottom:1px solid #eee;">Points</th>

                <th style="text-align:left; padding:10px; border-bottom:1px solid #eee;">Notes</th>
              </tr>
            </thead>
            <tbody id="entriesBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/user.js"></script>
</body>
</html>
